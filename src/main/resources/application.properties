# Ollama connection
ollama.base.url=http://127.0.0.1:11434
ollama.default.model=qwen2.5:7b

# LLM request settings
ollama.request.timeout.minutes=5
ollama.temperature=0.5

# UI
app.window.title=AIChat - Local Offline LLM
app.window.width=640
app.window.height=540

# System prompt
chat.system.prompt=Ты — локальный офлайн-ассистент. Отвечай кратко, по делу, на русском языке. Не выдумывай факты о себе.

# Chat history
chat.history.max.messages=20